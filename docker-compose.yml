# PostgreSQL local para desarrollo y smoke tests de SubliManager V1.
# Uso: docker compose up -d
# Credenciales alineadas con .env.example

services:
  postgres:
    image: postgres:16-alpine
    container_name: sublimanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sublimanager
      POSTGRES_PASSWORD: sublimanager
      POSTGRES_DB: sublimanager
    ports:
      - "5432:5432"
    volumes:
      - sublimanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sublimanager -d sublimanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sublimanager_pgdata:
